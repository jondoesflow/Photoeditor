name: TestFlight

# Archives Grade, signs it with cloud-managed signing and uploads it to App Store Connect / TestFlight.
# No Mac needed. Run it from the Actions tab ("Run workflow"), push a tag named testflight-*,
# or push to the `testflight` branch.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_KEY_P8                    The full text of the AuthKey_XXXX.p8 file, including the BEGIN/END lines

on:
  workflow_dispatch:
  push:
    tags: ["testflight-*"]
    branches: [testflight]

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets first:$missing"
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # The archive is built unsigned: development signing would need a registered device.
      # The export step below signs it for App Store distribution with a cloud-managed certificate.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Grade.xcodeproj \
            -scheme Grade \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Grade.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --renderer github-actions

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Grade.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log
          echo "::notice title=Uploaded::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # Publishes the export/upload logs (no secrets) to the testflight-reports branch for debugging.
      - name: Publish logs
        if: always()
        run: |
          mkdir -p tf-reports
          cp build/export.log tf-reports/ 2>/dev/null || true
          cp build/ExportOptions.plist tf-reports/ 2>/dev/null || true
          LOGDIR=$(grep -o '/var/folders/[^ ]*\.xcdistributionlogs' build/export.log 2>/dev/null | head -1)
          [ -n "$LOGDIR" ] && [ -d "$LOGDIR" ] && cp -R "$LOGDIR" tf-reports/distribution-logs || true
          grep -rl "BEGIN PRIVATE KEY" tf-reports && rm -rf tf-reports/* || true
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > tf-reports/commit.txt
          cd tf-reports
          git init -q && git checkout -q -b testflight-reports && git add -A
          git -c user.name="grade-ci" -c user.email="grade-ci@users.noreply.github.com" commit -qm "TestFlight logs ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" testflight-reports
